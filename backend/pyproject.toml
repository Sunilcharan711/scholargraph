[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "scholargraph-backend"
version = "0.1.0"
description = "Citation-grounded research intelligence API"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "pymupdf>=1.25,<2",
  "python-multipart>=0.0.20,<1",
  "sentence-transformers>=3.4,<6",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "postgres: requires an explicitly configured disposable PostgreSQL test database",
  "model: opt-in actual sentence-transformer model verification",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
