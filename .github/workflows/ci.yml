name: Verify ScholarGraph
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: scholargraph
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: scholargraph_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scholargraph -d scholargraph_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://scholargraph:ci_only_password@localhost:5432/scholargraph_test
    steps:
      - uses: actions/checkout@v4
      - name: Verify reranker model reaches the Compose backend
        env:
          POSTGRES_PASSWORD: ci_only_password
          RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2
        run: docker compose config --format json | jq -e '.services.backend.environment.RERANKER_MODEL == env.RERANKER_MODEL'
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
      - run: uv sync --project backend --python 3.12 --locked --extra cpu
      - run: uv run --project backend --locked --extra cpu ruff check backend scripts
      - run: uv run --project backend --locked --extra cpu ruff format --check backend scripts
      - run: uv run --project backend --locked --extra cpu pytest -c backend/pyproject.toml
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run build && npm run typecheck
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: scholargraph_ci
      POSTGRES_PASSWORD: ci_only_password
      LLM_PROVIDER: ""
      CHAT_MODEL: ""
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Verify VPS services cannot bypass the authenticated proxy
        env:
          SITE_ADDRESS: ci.invalid
          SITE_ORIGIN: https://ci.invalid
          AUTH_USER: ci
          AUTH_PASSWORD_HASH: config_validation_only
        run: |
          docker compose -f docker-compose.yml -f compose.vps.yml config --format json | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; assert all(not s[n].get("ports") for n in ("db","backend","frontend","ollama")); assert s["proxy"]["ports"]'
      - name: Build and start the stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Verify frontend, proxy and database
        run: python3 scripts/check_docker.py
      - name: Verify startup after restart
        run: |
          docker compose restart
          docker compose up -d --wait --wait-timeout 180
          python3 scripts/check_docker.py
      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p reports/docker-ci
          docker compose ps --all > reports/docker-ci/services.txt
          docker compose logs --no-color > reports/docker-ci/containers.log 2>&1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docker-failures
          path: reports/docker-ci
      - name: Remove disposable CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
